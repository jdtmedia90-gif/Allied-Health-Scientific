<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yosdi's Homemade Habanero Pepper Sauce</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="logo-container">

    <img src="logo.png" alt="Logo">

    <div class="logo-text">
      <h1>Yosdi's Homemade Habanero Pepper Sauce</h1>
      <div>
        The pepper sauce of the West! 🇧🇿<br>
        Yosdi's Homemade Habanero Pepper Sauce is here to deliver! 🥵💥🌶
      </div>
    </div>

  </div>

  <nav class="toolbar">
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">
      Cart (<span id="cart-count">0</span>)
    </a>
  </nav>

</header>

<!-- BANNER -->
<img src="banner.png" class="banner" alt="Banner">

<!-- SHOP NOW -->
<div class="shop-now">Shop Now</div>

<!-- FILTERS -->
<div class="filters">
  <input type="text" id="search" placeholder="Search products...">
  <select id="category-filter">
    <option value="">All</option>
  </select>
</div>

<main>

  <div id="product-list"></div>

  <!-- REVIEWS -->
  <section class="reviews-section">
    <h2>Customer Reviews</h2>

    <div class="reviews-grid">
      <img src="r1.png" alt="Review 1">
      <img src="r2.png" alt="Review 2">
      <img src="r3.png" alt="Review 3">
      <img src="r4.png" alt="Review 4">
      <img src="r5.png" alt="Review 5">
      <img src="r6.png" alt="Review 6">
      <img src="r7.png" alt="Review 7">
      <img src="r8.png" alt="Review 8">

</html>
